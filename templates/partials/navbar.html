{{ define "navbar" }}
<header class="site-header">
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="brand-controller" aria-hidden="true">🎮</span>
            <span class="brand-name">GameForum</span>
        </a>

        <div class="navbar-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/categories" class="nav-link">Categories</a>
            <a href="/recent" class="nav-link">Recent Posts</a>
            <a href="/about" class="nav-link">About</a>
        </div>

        <div class="navbar-actions">
            <form class="navbar-search" action="/search" method="GET">
                <label class="sr-only" for="navbar-search-input">
                    Search forum
                </label>

                <input
                    id="navbar-search-input"
                    type="search"
                    name="q"
                    placeholder="Search discussions..."
                    autocomplete="off"
                >
            </form>

            {{ if .IsAuthenticated }}
                <a
                    href="/notifications"
                    class="notification-button"
                    aria-label="Notifications"
                >
                    🔔

                    {{ if gt .UnreadNotificationCount 0 }}
                        <span class="notification-count">
                            {{ .UnreadNotificationCount }}
                        </span>
                    {{ end }}
                </a>

                <a href="/profile" class="user-menu">
                    <span class="user-avatar">
                        {{ .CurrentUser.Username }}
                    </span>

                    <span class="user-name">
                        {{ .CurrentUser.Username }}
                    </span>
                </a>

                <form
                    class="logout-form"
                    action="/logout"
                    method="POST"
                >
                    <button
                        type="submit"
                        class="logout-button"
                    >
                        Log Out
                    </button>
                </form>
            {{ else }}
                <a href="/auth?mode=login" class="nav-login">
                    Log In
                </a>

                <a href="/auth?mode=signup" class="button button-primary">
                    Sign Up
                </a>
            {{ end }}
        </div>
    </nav>
</header>
{{ end }}
